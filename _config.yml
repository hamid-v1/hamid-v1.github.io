# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

lang: en

# Change to your timezone › https://zones.arilyn.cc
timezone: Asia/Karachi

# jekyll-seo-tag settings
title: Hamid devs

tagline: CTF/HTB Writeups, Offensive Tooling & Cybersecurity Blogs

description: >-
  A collection of CTF writeups, security research, custom offensive
  tooling, and technical notes on cybersecurity, exploitation,
  and tool development.

url: "https://hamid-v1.github.io"

github:
  username: hamid-v1

twitter:
  username: # left empty on purpose, since you don't want Twitter linked

social:
  name: Hamid
  email: your-email@domain.com   # ← put a real email here, or leave blank to hide it
  fediverse_handle:
  links:
    # First link = copyright owner's link (shown in footer) — now your GitHub since no Twitter
    - https://github.com/hamid-v1
    # Uncomment and add more if you want:
    # - https://www.linkedin.com/in/yourhandle

webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

pageviews:
  provider:

theme_mode:

cdn:

avatar: /assets/images/avatar.jpg   # ← fixed: missing space was breaking YAML

social_preview_image:

toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

comments:
  provider:
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

baseurl: ""

# ------------ Not recommended to modify below ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
